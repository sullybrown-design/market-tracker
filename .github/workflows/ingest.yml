name: Ingest market data
on:
  schedule:
    - cron: "*/20 11-23 * * 1-5"
    - cron: "*/20 0-2 * * 2-6"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "fast or candles or all"
        default: "fast"
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "30 22 * * 1-5" ]; then echo "mode=candles" >> $GITHUB_OUTPUT;
          else echo "mode=fast" >> $GITHUB_OUTPUT; fi
      - name: Run ingestion
        run: python3 scripts/ingest.py ${{ steps.mode.outputs.mode }}
      - name: Commit updated data
        run: |
          git config user.name "market-tracker-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: refresh ${{ steps.mode.outputs.mode }} $(date -u +%FT%TZ)"; for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done; fi
